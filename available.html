<!DOCTYPE html>
<html><head><title>All Products - FarmerCart</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="logo" onclick="location.href='index.html'">FarmerCart<span>Fresh • Seeds • Fertilizer</span></div><div class="search-box"><input id="search" placeholder="Search Seeds, Fertilizer, Pesticide..." onkeyup="doSearch()"><button>🔍</button></div><select class="lang-small"><option>🌐 EN</option><option>Hindi</option></select><button class="head-cart" onclick="location.href='cart.html'">🛒 Cart (<span id="cartCount">0</span>)</button></header>
<nav><a href="index.html">Home</a><a href="available.html" class="active">All Products</a><a href="seeds.html">Seeds</a><a href="fertilizer.html">Fertilizer</a><a href="pesticides.html">Pesticides</a><a href="fresh-crops.html">Fresh Crops</a><a href="grocery.html">Grocery</a><a href="orders.html">My Orders</a></nav>
<main>
<div class="section-title"><span>All Products - FarmerCart Only Seller</span></div>
<div class="card" style="display:flex;gap:8px;flex-wrap:wrap">
<select id="sort" onchange="renderList()" style="max-width:200px"><option value="">Sort: Popularity</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option><option value="rating">Rating</option></select>
<select id="filterCat" onchange="renderList()" style="max-width:200px"><option value="">All Categories</option><option>Seed</option><option>Fertilizer</option><option>Pesticide</option><option>Fresh</option><option>Grocery</option></select>
<select id="filterPrice" onchange="renderList()" style="max-width:200px"><option value="">All Prices</option><option value="0-200">Under ₹200</option><option value="200-500">₹200 - ₹500</option><option value="500-2000">Above ₹500</option></select>
<button class="btn-blue" onclick="location.href='cart.html'">Go to Cart →</button>
</div>
<div class="grid" id="list"></div>
</main>
<script>
let products=JSON.parse(localStorage.getItem('fc_products')||'[]');
if(products.length==0){ products=[
{id:1,cat:'Seed',name:'Tomato Seeds - Hybrid (100g)',price:149,old:249,rating:'4.6',emoji:'🌱',seller:'FarmerCart',stock:'In Stock'},
{id:2,cat:'Seed',name:'Wheat Seeds - HD 2967 (5kg)',price:349,old:499,rating:'4.7',emoji:'🌾',seller:'FarmerCart',stock:'In Stock'},
{id:3,cat:'Seed',name:'Paddy Seeds (5kg)',price:399,old:599,rating:'4.5',emoji:'🌾',seller:'FarmerCart',stock:'In Stock'},
{id:4,cat:'Fertilizer',name:'Urea Fertilizer - 45kg Bag',price:299,old:399,rating:'4.6',emoji:'🧪',seller:'FarmerCart',stock:'In Stock'},
{id:5,cat:'Fertilizer',name:'DAP Fertilizer - 50kg Bag',price:1299,old:1599,rating:'4.8',emoji:'🧪',seller:'FarmerCart',stock:'In Stock'},
{id:6,cat:'Fertilizer',name:'NPK 19:19:19 - 1kg',price:249,old:349,rating:'4.5',emoji:'🧪',seller:'FarmerCart',stock:'In Stock'},
{id:7,cat:'Pesticide',name:'Neem Oil Pesticide - 1 Litre',price:299,old:449,rating:'4.6',emoji:'🛡️',seller:'FarmerCart',stock:'In Stock'},
{id:8,cat:'Pesticide',name:'Fungicide - Saaf 500g',price:349,old:499,rating:'4.7',emoji:'🛡️',seller:'FarmerCart',stock:'In Stock'},
{id:9,cat:'Fresh',name:'Mango (Dussehri) - 1kg',price:60,old:99,rating:'4.6',emoji:'🥭',seller:'FarmerCart',stock:'300 kg'},
{id:10,cat:'Fresh',name:'Tomato - 1kg',price:22,old:35,rating:'4.4',emoji:'🍅',seller:'FarmerCart',stock:'150 kg'},
{id:11,cat:'Fresh',name:'Potato - 1kg',price:18,old:28,rating:'4.5',emoji:'🥔',seller:'FarmerCart',stock:'500 kg'},
{id:12,cat:'Grocery',name:'Atta - Whole Wheat 5kg',price:249,old:329,rating:'4.6',emoji:'🌾',seller:'FarmerCart',stock:'In Stock'},
{id:13,cat:'Grocery',name:'Basmati Rice - 5kg',price:499,old:699,rating:'4.7',emoji:'🍚',seller:'FarmerCart',stock:'In Stock'}
]; localStorage.setItem('fc_products',JSON.stringify(products));}
function renderList(){
let q=(document.getElementById('search').value||localStorage.getItem('fc_search')||'').toLowerCase();
if(localStorage.getItem('fc_search')){document.getElementById('search').value=localStorage.getItem('fc_search');}
let sort=document.getElementById('sort').value; let cat=document.getElementById('filterCat').value; let pr=document.getElementById('filterPrice').value;
let list=products.filter(p=> (p.name.toLowerCase().includes(q)||p.cat.toLowerCase().includes(q)) && (!cat||p.cat==cat) && (!pr|| (pr=='0-200'&&p.price<=200)||(pr=='200-500'&&p.price>200&&p.price<=500)||(pr=='500-2000'&&p.price>500)));
if(sort=='low') list.sort((a,b)=>a.price-b.price); if(sort=='high') list.sort((a,b)=>b.price-a.price); if(sort=='rating') list.sort((a,b)=>b.rating-a.rating);
let g=document.getElementById('list'); g.innerHTML='';
if(list.length==0) g.innerHTML='<div class="card">No products found.</div>';
list.forEach(p=>{let off=Math.round((1-p.price/p.old)*100); g.innerHTML+=`<div class="p-card"><div class="p-img">${p.emoji}</div><h4>${p.name}</h4><p><span class="p-rating">${p.rating} ★</span> 2,341 Ratings</p><p class="p-price">₹${p.price} <span class="p-old">₹${p.old}</span> <span class="p-off">${off}% off</span></p><p class="p-seller">Seller: FarmerCart • ${p.stock} • Category: ${p.cat}</p><p class="p-delivery">FREE Delivery • COD Available</p><p class="phone-box">Seller: FarmerCart</p><br><button class="btn" onclick="addToCart(${p.id})">ADD TO CART</button><button class="btn btn-buy" onclick="buyNow(${p.id})">BUY NOW</button></div>`;});
}
function addToCart(id){let cart=JSON.parse(localStorage.getItem('fc_cart')||'[]'); let p=products.find(x=>x.id==id); let ex=cart.find(x=>x.id==id); if(ex) ex.qty++; else cart.push({...p,qty:1}); localStorage.setItem('fc_cart',JSON.stringify(cart)); document.getElementById('cartCount').innerText=cart.length; alert(p.name+' added to cart!');}
function buyNow(id){addToCart(id); location.href='cart.html';}
function doSearch(){renderList();}
renderList(); document.getElementById('cartCount').innerText=JSON.parse(localStorage.getItem('fc_cart')||'[]').length;
</script>
<footer><b>FarmerCart | Seller Only: FarmerCart</b></footer>
</body></html>
